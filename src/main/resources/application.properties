# 1.初始化学习记录：配置文件说明
# 注意：学习注意：
# 1.线上环境建议修改数据库密码，不要明文直接提交代码仓库；
# 2.正式环境 MySQL 建议开启 useSSL=true。


# SpringMVC静态资源请求匹配规则，浏览器访问路径格式 /resources/xxx
spring.mvc.static-path-pattern=/resources/**

# 静态文件存放目录，支持多个路径，项目内classpath下file-test、static文件夹
spring.web.resources.static-locations=classpath:/file-test/,classpath:/static/
# 设置服务监听地址0.0.0.0，允许局域网/其他IP访问项目；127.0.0.1仅本机访问
server.address=0.0.0.0
# SpringBoot服务启动端口
server.port=28099
# 数据源名称标识
spring.datasource.name=newbee-mall-datasource
# MySQL8.x驱动类全名，mysql5使用com.mysql.jdbc.Driver
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# 数据库连接地址：库名、时区、编码、允许多条SQL执行、关闭SSL校验
spring.datasource.url=jdbc:mysql://localhost:3306/newbee_mall_db_v2?useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&autoReconnect=true&useSSL=false&allowMultiQueries=true
# 数据库登录账号
spring.datasource.username=root
# 数据库登录密码
spring.datasource.password=nyh123
# Hikari连接池：最小空闲连接数
spring.datasource.hikari.minimum-idle=5
# Hikari连接池：最大连接数量
spring.datasource.hikari.maximum-pool-size=15
# 获取连接后是否自动提交事务
spring.datasource.hikari.auto-commit=true
# 空闲连接超时时间(毫秒)，空闲超过时长释放连接
spring.datasource.hikari.idle-timeout=30000
# 连接池名称，用于日志区分
spring.datasource.hikari.pool-name=hikariCP
# 连接最大生命周期，不要超过mysql连接超时时间
spring.datasource.hikari.max-lifetime=600000
# 获取数据库连接的最大等待超时时间(毫秒)
spring.datasource.hikari.connection-timeout=30000
# 连接存活检测SQL，定时验证连接是否有效
spring.datasource.hikari.connection-test-query=SELECT 1
# Mybatis xml映射文件存放路径
mybatis.mapper-locations=classpath:mapper/*Mapper.xml

# 开启DAO层SQL日志打印，查看执行SQL语句（注释状态，放开即可生效）
# logging.level.ltd.newbee.mall.dao=debuglogging.level.ltd.newbee.mall.dao=debug